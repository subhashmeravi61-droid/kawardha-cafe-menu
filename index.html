<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kawardha Cafe | VVIP</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body { background: #000; color: #fff; font-family: sans-serif; padding: 15px; margin: 0; }
        .header { text-align: center; margin-bottom: 20px; }
        .input-box { width: 100%; padding: 18px; margin: 10px 0; border: 2px solid #bf00ff; background: #111; color: #fff; border-radius: 15px; font-size: 16px; outline: none; }
        .card { background: #111; padding: 15px; border-radius: 20px; border: 2px solid #bf00ff; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        .btn-qty { width: 50px; height: 50px; border-radius: 50%; border: none; color: white; font-weight: bold; font-size: 20px; cursor: pointer; }
        .btn-send { width: 100%; padding: 25px; background: #bf00ff; border: none; border-radius: 15px; font-weight: bold; font-size: 20px; color: white; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-size:50px;">👑</div>
        <h1 style="color:#bf00ff;">VVIP MENU</h1>
    </div>

    <input type="text" class="input-box" id="name" placeholder="अपना नाम लिखें">
    <input type="text" class="input-box" id="addr" placeholder="अपना पता लिखें">
    <input type="text" class="input-box" id="mob" placeholder="मोबाइल नंबर">

    <div id="itemsContainer"></div>
    <h2 id="totalDisplay" style="text-align:center; color:#bf00ff;">कुल: ₹0</h2>
    <button class="btn-send" onclick="sendOrder()">ऑर्डर कन्फर्म करें 🔥</button>

    <script>
        const menu = [
            { name: "Cheese Pizza", pS: 150, pL: 250 },
            { name: "Veg Burger", pS: 60, pL: 100 },
            { name: "Cold Coffee", pS: 80, pL: 120 },
            { name: "French Fries", pS: 50, pL: 90 }
        ];

        const container = document.getElementById('itemsContainer');
        menu.forEach((item, i) => {
            item.qtyS = 0; item.qtyL = 0;
            container.innerHTML += `
            <div class="card">
                <div><b>${item.name}</b><br><small>S:₹${item.pS} | L:₹${item.pL}</small></div>
                <div style="display:flex; gap:10px;">
                    <button class="btn-qty" style="background:#007bff;" onclick="upd(${i},'S',-1)">-</button>
                    <span id="s${i}" style="width:20px; text-align:center;">0</span>
                    <button class="btn-qty" style="background:#007bff;" onclick="upd(${i},'S',1)">+</button>
                    <button class="btn-qty" style="background:#ff4500;" onclick="upd(${i},'L',-1)">-</button>
                    <span id="l${i}" style="width:20px; text-align:center;">0</span>
                    <button class="btn-qty" style="background:#ff4500;" onclick="upd(${i},'L',1)">+</button>
                </div>
            </div>`;
        });

        function upd(i, type, v) {
            if(type=='S') { menu[i].qtyS = Math.max(0, menu[i].qtyS + v); document.getElementById('s'+i).innerText = menu[i].qtyS; }
            else { menu[i].qtyL = Math.max(0, menu[i].qtyL + v); document.getElementById('l'+i).innerText = menu[i].qtyL; }
            calc();
        }

        function calc() {
            let t = menu.reduce((sum, item) => sum + (item.qtyS * item.pS) + (item.qtyL * item.pL), 0);
            document.getElementById('totalDisplay').innerText = "कुल: ₹" + t;
        }

        function sendOrder() {
            let n = document.getElementById('name').value;
            let m = document.getElementById('mob').value;
            if(!n || !m) { alert("नाम और नंबर भरें!"); return; }

            let msg = `*ORDER REQUEST*\nName: ${n}\nMob: ${m}\n\n`;
            menu.forEach(item => { if(item.qtyS>0) msg+=`• ${item.name} (S): ${item.qtyS}\n`; if(item.qtyL>0) msg+=`• ${item.name} (L): ${item.qtyL}\n`; });
            msg += "\n" + document.getElementById('totalDisplay').innerText;
            
            // Yahan hum link create karke click kar rahe hain, ye error nahi dega
            let link = document.createElement('a');
            link.href = "https://wa.me/916264917767?text=" + encodeURIComponent(msg);
            link.target = "_blank";
            link.click();
        }
    </script>
</body>
</html>
