<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kawardha Cafe | VVIP</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; text-align: center; overflow-x: hidden; }
        .crown { font-size: 70px; display: block; margin-bottom: -10px; }
        .logo-circle { width: 180px; height: 180px; border: 4px solid #bf00ff; border-radius: 50%; margin: 15px auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 25px #bf00ff; }
        .logo-text { color: #bf00ff; font-size: 24px; font-weight: bold; line-height: 1.2; }
        .vvip-title { font-size: 48px; color: #bf00ff; margin: 20px 0; text-transform: uppercase; text-shadow: 0 0 15px #bf00ff; }
        .input-box { width: 100%; padding: 22px; margin: 12px 0; border: 2px solid #bf00ff; background: #111; color: #fff; border-radius: 15px; font-size: 20px; }
        .card { background: #111; padding: 25px; margin: 20px 0; border: 2px solid #bf00ff; border-radius: 20px; display: flex; align-items: center; }
        .item-img { width: 110px; height: 110px; border-radius: 15px; margin-right: 20px; border: 2px solid #bf00ff; }
        .item-info { flex-grow: 1; text-align: left; color: #bf00ff; }
        .item-name { font-size: 24px; margin: 0 0 10px 0; }
        .btn-qty { width: 65px; height: 65px; font-size: 28px; border: none; border-radius: 50%; color: #fff; margin: 0 10px; font-weight: bold; }
        .blue-btn { background: #007bff; box-shadow: 0 0 15px #007bff; }
        .red-btn { background: #ff4500; box-shadow: 0 0 15px #ff4500; }
        .qty-val { font-size: 24px; color: #fff; margin: 0 10px; }
        .btn-send { width: 100%; padding: 25px; font-size: 24px; background: #bf00ff; color: #fff; border: none; border-radius: 15px; margin-top: 30px; font-weight: bold; box-shadow: 0 0 20px #bf00ff; }
    </style>
</head>
<body>

    <span class="crown">👑</span>
    <div class="logo-circle">
        <div class="logo-text">Kawardha<br>Cafe</div>
    </div>
    <h1 class="vvip-title">VVIP MENU</h1>

    <input type="text" class="input-box" placeholder="अपना नाम लिखें">
    <input type="text" class="input-box" placeholder="अपना पता लिखें">
    <input type="text" class="input-box" placeholder="मोबाईल नंबर">

    <div id="itemsContainer"></div>

    <h2 id="totalDisplay" style="color: #bf00ff; font-size: 32px; margin-top: 30px;">कुल: ₹0</h2>
    <button class="btn-send" onclick="alert('ऑर्डर कन्फर्म!')">ऑर्डर कन्फर्म करें 🔥</button>

    <script>
        const menu = [
            { name: "Cheese Pizza", pS: 150, pL: 250, img: "https://via.placeholder.com/150" },
            { name: "Veg Burger", pS: 60, pL: 100, img: "https://via.placeholder.com/150" }
        ];

        const container = document.getElementById('itemsContainer');
        menu.forEach((item, i) => {
            container.innerHTML += `
            <div class="card">
                <img src="${item.img}" class="item-img">
                <div class="item-info">
                    <h3 class="item-name">${item.name}</h3>
                    <div style="font-weight:bold; margin-bottom:10px;">छोटा (₹${item.pS}) 
                        <button class="btn-qty blue-btn">-</button><span class="qty-val">0</span><button class="btn-qty blue-btn">+</button>
                    </div>
                    <div style="font-weight:bold;">बड़ा (₹${item.pL}) 
                        <button class="btn-qty red-btn">-</button><span class="qty-val">0</span><button class="btn-qty red-btn">+</button>
                    </div>
                </div>
            </div>`;
        });
    </script>
</body>
</html>
