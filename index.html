<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kawardha Cafe | VVIP</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; margin: 0; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .crown { font-size: 80px; display: block; filter: drop-shadow(0 0 15px #bf00ff); }
        .logo-circle { width: 200px; height: 200px; border: 6px solid #bf00ff; border-radius: 50%; margin: 15px auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px #bf00ff; }
        .logo-text { color: #bf00ff; font-size: 32px; font-weight: bold; text-align: center; line-height: 1.2; }
        
        /* Bada Input box */
        .input-box { width: 100%; padding: 25px; margin: 15px 0; border: 3px solid #bf00ff; background: #111; color: #fff; border-radius: 20px; font-size: 20px; outline: none; }
        
        .card { background: #111; padding: 25px; border-radius: 25px; border: 3px solid #bf00ff; margin-bottom: 25px; display: flex; align-items: center; justify-content: space-between; }
        
        .btn-qty { width: 70px; height: 70px; border-radius: 50%; border: none; color: white; font-weight: bold; font-size: 30px; cursor: pointer; }
        .blue-btn { background: #007bff; box-shadow: 0 0 20px #007bff; }
        .red-btn { background: #ff4500; box-shadow: 0 0 20px #ff4500; }
        
        .btn-send { width: 100%; padding: 30px; background: #bf00ff; border: none; border-radius: 20px; font-weight: bold; font-size: 28px; color: white; margin-top: 30px; box-shadow: 0 0 25px #bf00ff; }
        
        /* Text size badhane ke liye */
        b { font-size: 24px !important; }
        small { font-size: 18px !important; }
    </style>
</head>
<body>

    <div class="header">
        <span class="crown">👑</span>
        <div class="logo-circle">
            <div class="logo-text">Kawardha<br>Cafe</div>
        </div>
        <h1 style="color:#bf00ff; font-size: 45px; margin-top: 15px;">VVIP MENU</h1>
    </div>

    <input type="text" class="input-box" id="name" placeholder="अपना नाम लिखें">
    <input type="text" class="input-box" id="addr" placeholder="अपना पता लिखें">
    <input type="text" class="input-box" id="mob" placeholder="मोबाइल नंबर">

    <div id="itemsContainer"></div>
    <h2 id="totalDisplay" style="text-align:center; color:#bf00ff; font-size: 40px; margin: 30px 0;">कुल: ₹0</h2>
    <button class="btn-send" onclick="sendOrder()">ऑर्डर कन्फर्म करें 🔥</button>

    <script>
        const menu = [
            { name: "Cheese Pizza", pS: 150, pL: 250 },
            { name: "Veg Burger", pS: 60, pL: 100 },
            { name: "Cold Coffee", pS: 80, pL: 120 },
            { name: "French Fries", pS: 50, pL: 90 }
        ];

        const container = document.getElementById('itemsContainer');
        menu.forEach((item, i) => {
            item.qtyS = 0; item.qtyL = 0;
            container.innerHTML += `
            <div class="card">
                <div><b>${item.name}</b><br><small style="color:#aaa;">S:₹${item.pS} | L:₹${item.pL}</small></div>
                <div style="display:flex; gap:15px;">
                    <div style="display:flex; gap:10px; align-items:center;">
                        <button class="btn-qty blue-btn" onclick="upd(${i},'S',-1)">-</button>
                        <span id="s${i}" style="width:30px; text-align:center; font-size:24px;">0</span>
                        <button class="btn-qty blue-btn" onclick="upd(${i},'S',1)">+</button>
                    </div>
                    <div style="display:flex; gap:10px; align-items:center;">
                        <button class="btn-qty red-btn" onclick="upd(${i},'L',-1)">-</button>
                        <span id="l${i}" style="width:30px; text-align:center; font-size:24px;">0</span>
                        <button class="btn-qty red-btn" onclick="upd(${i},'L',1)">+</button>
                    </div>
                </div>
            </div>`;
        });

        function upd(i, type, v) {
            if(type=='S') { menu[i].qtyS = Math.max(0, menu[i].qtyS + v); document.getElementById('s'+i).innerText = menu[i].qtyS; }
            else { menu[i].qtyL = Math.max(0, menu[i].qtyL + v); document.getElementById('l'+i).innerText = menu[i].qtyL; }
            calc();
        }

        function calc() {
            let t = menu.reduce((sum, item) => sum + (item.qtyS * item.pS) + (item.qtyL * item.pL), 0);
            document.getElementById('totalDisplay').innerText = "कुल: ₹" + t;
        }

        function sendOrder() {
            let n = document.getElementById('name').value;
            let a = document.getElementById('addr').value;
            let m = document.getElementById('mob').value;
            if(!n || !m) { alert("कृपया नाम और मोबाइल नंबर भरें!"); return; }
            let msg = `*ORDER REQUEST*\nName: ${n}\nAddr: ${a}\nMob: ${m}\n\n`;
            menu.forEach(item => { 
                if(item.qtyS > 0) msg += `• ${item.name} (S): ${item.qtyS}\n`; 
                if(item.qtyL > 0) msg += `• ${item.name} (L): ${item.qtyL}\n`; 
            });
            msg += "\n" + document.getElementById('totalDisplay').innerText;
            window.location.href = "https://wa.me/916264917767?text=" + encodeURIComponent(msg);
        }
    </script>
</body>
</html>
